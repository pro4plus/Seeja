name: Build APK

# عند كل push على main (أو تشغيل يدوي): فحص + اختبارات + بناء APK،
# والـ APK يظهر في Artifacts تحت اسم alseeja-apk — بلا حاجة لـ Android SDK محلي.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ثبّت Java 17: إصدار Gradle في المشروع (8.3) لا يعمل مع
      # Java 25 الافتراضية في صورة ubuntu-latest الحالية.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: alseeja-apk
          path: build/app/outputs/flutter-apk/app-release.apk
