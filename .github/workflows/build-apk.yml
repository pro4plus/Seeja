name: Build Alseeja Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Generate Sound Effects
        run: python3 tools/make_sounds.py

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Ensure Android platform files exist
        run: flutter create --platforms=android --org com.alseejja --project-name alseeja .

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alseeja-apk
          path: build/app/outputs/flutter-apk/app-release.apk
