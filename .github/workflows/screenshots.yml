name: Screenshots v5

# لقطات ذهبية لإعادة التصميم البصري v5: فحص + توليد اللقطات الأربع
# كاختبار ودجت عادي على flutter_tester (بدون جهاز، بلا -d)، ثم
# تشغيل الاختبارات كاملة للمقارنة، ورفع اللقطات كأرتيفاكت.
on:
  push:
    branches: [visual-redesign-v5]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --update-goldens test/screenshot_test.dart
      - run: flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-v5
          path: test/goldens/
